version: "1"

clickhouse:
  host: localhost
  port: 9000
  database: default
  username: default

table:
  name: events
  columns:
    - name: timestamp
      type: DateTime64
      generator:
        type: timestamp

    - name: device_id
      type: UInt64
      generator:
        type: random
        min: 1
        max: 1000000
    
    - name: temperature
      type: Float64
      generator:
        type: normal
        mean: 25
        stddev: 5
    
    - name: status
      type: String
      generator:
        type: choice
        values:
          - OK
          - WARNING
          - ERROR

workload:
  rate: 100000
  batch_size: 10000
  workers: 4
  duration: 60s
